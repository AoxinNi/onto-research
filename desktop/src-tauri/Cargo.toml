[package]
name = "onto-research-desktop"
version = "0.1.0"
description = "ONTO Research desktop app"
authors = ["ONTO Research"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The _lib suffix keeps the library and binary names apart (a Cargo limitation on Windows).
name = "onto_research_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
