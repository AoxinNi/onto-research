[project]
name = "onto-research"
version = "0.1.0"
description = "科学研究 Agent 平台与类型化本体工作台"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6",
    "mcp>=2.3,<3",
    "anthropic>=2.6,<3",
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ontology*", "workbench*"]

[tool.setuptools.package-data]
ontology = ["schema/*.yaml", "schema/registry/*.sql", "migrations/*.sql"]
workbench = ["static/*", "static/vendor/*", "static/vendor/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
