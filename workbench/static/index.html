<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>本体工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305060a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23f7931a' stroke-width='1.6' stroke-dasharray='3 3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f7931a'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/vendor/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="stage" aria-label="三维知识图谱">
    <div id="scene"></div>
    <div class="vignette" aria-hidden="true"></div>

    <section id="empty" hidden>
      <p class="eyebrow">ONTOLOGY / 本体</p>
      <h2>从一个问题开始，<br>长出一张图。</h2>
      <p class="lede">告诉 agent 你想理解什么。它会搜索、建节点、连关系，每一步都先以虚影出现，等你确认。</p>
      <div class="prompts">
        <button type="button" class="prompt-chip">围绕我的研究问题，梳理核心概念和假设</button>
        <button type="button" class="prompt-chip">把研究材料整理成可追溯的证据链</button>
        <button type="button" class="prompt-chip">哪些证据支持或反驳这个假设？</button>
      </div>
    </section>

    <header id="brand">
      <a class="back" href="/" aria-label="返回项目列表" data-tip="全部项目">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/>
          <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 3"/>
          <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
          <circle cx="27.5" cy="9" r="1.6" fill="currentColor"/>
        </svg>
      </a>
      <div>
        <h1><a href="/" class="crumb">本体项目</a><span class="crumb-sep">/</span><span id="project-name">…</span></h1>
        <p class="stats"><span>ONTOLOGY</span><span id="stat-nodes">0</span> 节点<span id="stat-links">0</span> 关系<span id="stat-feeds">0</span> 数据流</p>
      </div>
    </header>

    <div id="review-wrap" hidden>
      <button type="button" id="review-pill" aria-expanded="false" aria-controls="review-pop">
        <span class="pulse" aria-hidden="true"></span><span id="review-count"></span>
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div id="review-pop" class="glass" hidden></div>
    </div>

    <div id="search" class="glass">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="search-input" type="search" placeholder="搜索节点" autocomplete="off" spellcheck="false" aria-label="搜索节点">
      <kbd>⌘K</kbd>
      <ul id="search-results" role="listbox" hidden></ul>
    </div>

    <aside id="detail" class="glass" hidden aria-live="polite"></aside>

    <nav id="legend" aria-label="类型筛选"></nav>

    <div id="dock" class="glass" role="toolbar" aria-label="视角">
      <button type="button" data-action="refresh" data-tip="立即刷新数据 · U" aria-label="立即刷新数据">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 7.5A6 6 0 0 0 4.6 6.2M4.5 12.5a6 6 0 0 0 10.9 1.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M15.8 3.6v4h-4M4.2 16.4v-4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" data-action="fit" data-tip="适配视角 · R">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" data-action="rotate" data-tip="自动环绕 · 空格" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="10" rx="7.5" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2" fill="currentColor"/><path d="m15.6 5.4 1.8 1.6-2.3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" data-action="labels" data-tip="显示全部标签 · L" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h8M4 14h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <div class="seg" role="radiogroup" aria-label="维度">
        <button type="button" data-action="dim3" role="radio" aria-checked="true">3D</button>
        <button type="button" data-action="dim2" role="radio" aria-checked="false">2D</button>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" data-action="timeline" data-tip="时间轴 · T" aria-pressed="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="6" cy="10" r="1.8" fill="currentColor"/><circle cx="11" cy="10" r="1.8" fill="currentColor"/><circle cx="15.5" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
      <button type="button" data-action="panel" data-tip="收起对话 · \" aria-pressed="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 4v12" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>

    <p id="hint">拖拽旋转 · 右键平移 · 滚轮缩放 · 点击节点聚焦</p>

    <div id="history-banner" hidden role="status">
      <span class="hb-dot" aria-hidden="true"></span>
      <span>正在查看 <b id="hb-when"></b> 的状态</span>
      <span id="hb-msg" class="hb-msg"></span>
      <button type="button" id="hb-now" class="btn sm primary">回到现在</button>
    </div>

    <div id="timeline" class="glass" hidden>
      <div class="tl-head">
        <span class="tl-title">时间轴</span>
        <span id="tl-caption" class="tl-caption"></span>
        <span class="tl-legend"><i class="c"></i>图的提交 <i class="r"></i>研报版本</span>
      </div>
      <div id="tl-track" class="tl-track" role="slider" tabindex="0" aria-label="时间轴" aria-valuemin="0">
        <div class="tl-rail"></div>
        <div id="tl-fill" class="tl-fill"></div>
        <div id="tl-ticks" class="tl-ticks"></div>
        <div id="tl-handle" class="tl-handle" aria-hidden="true"></div>
      </div>
    </div>
    <div id="toasts" aria-live="polite"></div>
  </main>

  <section id="panel" class="glass" aria-label="对话">
    <header>
      <div class="title">
        <span id="conn" class="conn" title="连接中"></span>
        <div class="title-text">
          <h2>Agent</h2>
          <span id="session-title" class="session-title"></span>
        </div>
      </div>
      <div class="head-actions">
        <div class="sess-wrap">
          <button type="button" id="sessions-btn" class="icon-btn" data-tip="历史对话" aria-label="历史对话" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 6.5V10l2.5 1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="sessions-menu" class="sess-menu" role="menu" hidden></div>
        </div>
        <button type="button" id="new-session" class="icon-btn" data-tip="新对话" aria-label="新对话">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5v10M5 10h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      <button type="button" id="undo" class="icon-btn" data-tip="撤销最近一次生效的变更集" aria-label="撤销上一步">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 4 8.5 7.5 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 8.5h7a4.5 4.5 0 0 1 0 9H9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      </div>
    </header>

    <div class="panel-tabs" role="tablist" aria-label="对话或研报">
      <button type="button" role="tab" data-tab="chat" aria-selected="true">对话</button>
      <button type="button" role="tab" data-tab="report" aria-selected="false">研报<span class="tab-dot" id="report-dot" hidden></span></button>
    </div>

    <section id="report-view" hidden aria-live="polite">
      <div class="rp-bar">
        <span id="rp-status" class="rp-status"></span>
        <button type="button" id="rp-regen" class="btn sm">重新生成</button>
      </div>
      <article id="report-body" class="rp-body"></article>
    </section>

    <div id="log" aria-live="polite">
      <div class="log-intro">
        <p>我能读写这张图：搜索已有节点、新建节点和关系、提议新类型。所有改动都会先进入待审核。</p>
      </div>
    </div>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="描述你想要的图…（Enter 发送，Shift+Enter 换行）" aria-label="消息"></textarea>
      <div class="composer-row">
        <div class="model-wrap">
          <button type="button" id="model-btn" class="model-btn" aria-haspopup="menu" aria-expanded="false" data-tip="选择模型">
            <span class="model-dot" aria-hidden="true"></span><span id="model-name">模型</span>
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
          <div id="model-menu" class="model-menu" role="menu" hidden></div>
        </div>
        <button type="submit" id="send" aria-label="发送">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </form>
  </section>

  <button type="button" id="reopen" aria-label="展开对话">
    <span class="conn on" aria-hidden="true"></span>Agent<kbd>\</kbd>
  </button>

  <div id="tip" role="tooltip" hidden></div>
  <div class="grain" aria-hidden="true"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
